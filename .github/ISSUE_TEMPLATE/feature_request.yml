name: Feature request
description: Suggest an idea or improvement for keytap
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for the idea! Want to build it yourself? Say so below, contributors are very welcome.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow or pain point, not just the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Control (grid, element tap)
        - Inspect
        - Record and replay
        - Suites and nightly
        - Debug tools
        - Command palette
        - Install and setup
        - Docs
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to work on this myself
